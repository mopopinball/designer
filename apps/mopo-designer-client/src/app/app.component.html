<router-outlet></router-outlet>

<mat-toolbar>
    <span>Mopo Pinball Designer</span>
    <span class="example-spacer"></span>
    <span>{{hardwareConfig.name}}</span>
    <mat-icon>edit</mat-icon>
    <span>Rule Engine:</span>
    <mat-select style="width: 33%;" (valueChange)="setEngine($event)" [value]="engine">
      <mat-option *ngFor="let engine of engines" [value]="engine">{{engine.id}}</mat-option>    
      </mat-select>
</mat-toolbar>
<mat-sidenav-container >
    <mat-sidenav mode="side" opened position="end">
      <div class="device-list">
          <mat-form-field >
            <mat-label>Devices</mat-label>
            <input matInput type="text" [(ngModel)]="deviceSearchTerm" (input)="searchDevices()">
            <button *ngIf="deviceSearchTerm" matSuffix mat-icon-button aria-label="Clear" (click)="clearDeviceSearch()">
              <mat-icon>close</mat-icon>
            </button>
          </mat-form-field>
          <div style="display: flex; flex-direction: column; gap: 1em; align-items: flex-start;">
          <mopo-lamp *ngFor="let lamp of this.lamps" [state]="lamp"></mopo-lamp>
        </div>
      </div>
    </mat-sidenav>
    <mat-sidenav-content>
        Triggers b

        <mat-card>
          <mat-card-content>Simple card</mat-card-content>
        </mat-card>
        
    </mat-sidenav-content>
  </mat-sidenav-container>
