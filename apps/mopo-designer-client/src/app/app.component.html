<router-outlet></router-outlet>

<mopo-toolbar
  [rootEngine]="rootEngine"
  [allEngines]="allEngines"
  [selectedEngine]="selectedEngine"
  (selectedEngineChanged)="setEngine($event)"
></mopo-toolbar>

<mat-sidenav-container>
  <mat-sidenav mode="side" opened position="end">
    <mat-toolbar>
      <span>{{ selectedEngine.id }} Properties</span>
      <span class="example-spacer"></span>
      <div class="property-buttons">
        <button mat-raised-button color="primary" (click)="addChild()">
          Add Child
        </button>
        <button
          mat-raised-button
          color="warn"
          (click)="removeEngine()"
          [disabled]="selectedEngine === rootEngine"
        >
          Delete {{ selectedEngine.id }}
        </button>
      </div>
    </mat-toolbar>
    <mat-accordion *ngIf="selectedEngine">
      <mat-expansion-panel
        [expanded]="step === 0"
        (opened)="setStep(0)"
        hideToggle
      >
        <mat-expansion-panel-header>
          <mat-panel-title>Attributes</mat-panel-title>
        </mat-expansion-panel-header>
        <mopo-attributes
          [selectedEngine]="selectedEngine"
          [autoStartDisabled]="selectedEngine === rootEngine"
        ></mopo-attributes>
      </mat-expansion-panel>
      <mat-expansion-panel
        [expanded]="step === 1"
        (opened)="setStep(1)"
        hideToggle
      >
        <mat-expansion-panel-header>
          <mat-panel-title>Devices</mat-panel-title>
        </mat-expansion-panel-header>
        <mopo-devices [selectedEngine]="selectedEngine"></mopo-devices>
      </mat-expansion-panel>
    </mat-accordion>
  </mat-sidenav>
  <mat-sidenav-content>
    Triggers b

    <mat-card>
      <mat-card-content>Simple card</mat-card-content>
    </mat-card>
  </mat-sidenav-content>
</mat-sidenav-container>
