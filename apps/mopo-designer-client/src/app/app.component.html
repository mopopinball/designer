<router-outlet></router-outlet>

<mopo-toolbar [rootEngine]="rootEngine" [allEngines]="allEngines" [selectedEngine]="selectedEngine"></mopo-toolbar>

<mat-sidenav-container>
  <mat-sidenav mode="side" opened position="end">
    <mat-accordion *ngIf="selectedEngine">
      <mat-expansion-panel
        [expanded]="step === 0"
        (opened)="setStep(0)"
        hideToggle
      >
        <mat-expansion-panel-header>
          <mat-panel-title> Attributes </mat-panel-title>
        </mat-expansion-panel-header>

        <div class="attributes">
          <mat-form-field>
            <mat-label>id</mat-label>
            <input matInput [(ngModel)]="selectedEngine.id" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Name</mat-label>
            <input matInput [(ngModel)]="selectedEngine.name" />
          </mat-form-field>
          <mat-form-field>
            <mat-label>Description</mat-label>
            <input matInput [(ngModel)]="selectedEngine.description" />
          </mat-form-field>
          <mat-checkbox [(ngModel)]="selectedEngine.autoStart">Auto Start</mat-checkbox>
        </div>
      </mat-expansion-panel>

      <mat-expansion-panel
        [expanded]="step === 1"
        (opened)="setStep(1)"
        hideToggle
      >
        <mat-expansion-panel-header>
          <mat-panel-title> Devices </mat-panel-title>
        </mat-expansion-panel-header>

        <div class="device-list">
          <mat-form-field>
            <mat-label>Devices</mat-label>
            <input
              matInput
              type="text"
              [(ngModel)]="deviceSearchTerm"
              (input)="searchDevices()"
            />
            <button
              *ngIf="deviceSearchTerm"
              matSuffix
              mat-icon-button
              aria-label="Clear"
              (click)="clearDeviceSearch()"
            >
              <mat-icon>close</mat-icon>
            </button>
          </mat-form-field>
          <div
            style="
              display: flex;
              flex-direction: column;
              gap: 1em;
              align-items: flex-start;
            "
          >
            <mopo-lamp
              *ngFor="let lamp of this.lamps"
              [state]="lamp"
            ></mopo-lamp>
          </div>
        </div>
      </mat-expansion-panel>
    </mat-accordion>
  </mat-sidenav>
  <mat-sidenav-content>
    Triggers b

    <mat-card>
      <mat-card-content>Simple card</mat-card-content>
    </mat-card>
  </mat-sidenav-content>
</mat-sidenav-container>
