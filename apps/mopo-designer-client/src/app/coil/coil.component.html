<mat-card>
  <mat-card-header>
    <div mat-card-avatar>
      <mat-icon *ngIf="coil.coilType === 'coil'">compress</mat-icon>
      <mat-icon *ngIf="coil.coilType === 'relay'">lock</mat-icon>
    </div>
    <mat-card-title>{{ coil.name }}</mat-card-title>
    <mat-card-subtitle
      >{{ dvivenBy }} {{ coil.number }} ({{ coil.coilType }})</mat-card-subtitle
    >
  </mat-card-header>
  <mat-card-content>
    <div class="coil-options">
      <mat-button-toggle-group
        [value]="state.coilState"
        (change)="onChange($event)"
      >
        <mat-button-toggle [value]="false">Off</mat-button-toggle>
        <mat-button-toggle [value]="true">On</mat-button-toggle>
      </mat-button-toggle-group>
    </div>
  </mat-card-content>
</mat-card>
