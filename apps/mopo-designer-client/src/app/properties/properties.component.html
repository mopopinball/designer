<mat-toolbar>
  <span>{{ title }}</span>
  <span class="example-spacer"></span>
  <div class="buttons">
    <ng-content select="[buttons]"></ng-content>
    <button mat-raised-button color="warn" (click)="onDelete()">Delete</button>
  </div>
</mat-toolbar>

<div class="prop-content">
  <ng-content select="[properties]"></ng-content>
</div>
